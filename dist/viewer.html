<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>RISM Online: Viewing IIIF Images</title>
    <script src="https://cdn.jsdelivr.net/npm/openseadragon@6.0.1/build/openseadragon/openseadragon.min.js"></script>
    <script type="application/javascript"
            src="/static/diva.js"></script>
    <style>
        body {
            padding: 0;
            margin: 0;
            font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
            overflow: hidden;
        }
        #page-layout {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #top-bar {
            flex: 0 0 56px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            padding: 0 16px;
            border-bottom: 1px solid #d9d9d9;
            background: rgba(255, 255, 255, 0.98);
        }
        #viewer-layout {
            position: relative;
            width: 100%;
            height: calc(100vh - 56px);
            flex: 1 1 auto;
            overflow: hidden;
        }
        #diva-wrapper {
            width: 100%;
            height: 100%;
        }
        #viewer-layout.record-open #diva-wrapper {
            clip-path: inset(0 var(--record-panel-width, 0px) 0 0);
        }
        #record-wrapper {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(44vw, 680px);
            min-width: 360px;
            border-left: 1px solid #d9d9d9;
            background: #ffffff;
            box-shadow: -10px 0 24px rgba(0, 0, 0, 0.14);
            transform: translateX(100%);
            transition: transform 220ms ease;
            z-index: 2;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }
        #record-wrapper.is-open {
            transform: translateX(0);
            pointer-events: auto;
        }
        #record-toggle[hidden] {
            display: none;
        }
        .viewer-button {
            appearance: none;
            border: 1px solid #1e3b6f;
            background: #ffffff;
            color: #1e3b6f;
            border-radius: 999px;
            min-width: 112px;
            padding: 9px 14px;
            font: inherit;
            line-height: 1;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
        }
        .viewer-button:hover {
            background: #f5f8ff;
        }
        .viewer-button:focus-visible {
            outline: 2px solid #1e3b6f;
            outline-offset: 2px;
        }
        #record-frame {
            width: 100%;
            height: 100%;
            border: 0;
            flex: 1 1 auto;
        }
        @media (max-width: 900px) {
            #record-wrapper {
                width: min(100vw, 420px);
                min-width: 0;
            }
        }
    </style>
</head>
<body>
<div id="page-layout">
    <div id="top-bar">
        <button id="viewer-close" class="viewer-button" type="button">Close Viewer</button>
        <button id="record-toggle" class="viewer-button" type="button" hidden>Show record</button>
    </div>
    <div id="viewer-layout">
        <div id="diva-wrapper"></div>
        <div id="record-wrapper">
            <iframe id="record-frame" title="Record"></iframe>
        </div>
    </div>
</div>

<script>
    const searchParams = new URLSearchParams(window.location.search);

    const hash = window.location.hash || "";
    const hashQuery = hash.startsWith("#?") ? hash.slice(2)
            : hash.includes("?")
                ? hash.slice(hash.indexOf("?") + 1)
                : "";
    const hashParams = new URLSearchParams(hashQuery);

    function getParamValue(name)
    {
        const value = searchParams.get(name) || hashParams.get(name);
        return value && value.trim() ? value.trim() : null;
    }

    const objectData = getParamValue("manifest");
    const recordUrl = getParamValue("record");
    const recordWrapper = document.getElementById("record-wrapper");
    const recordFrame = document.getElementById("record-frame");
    const recordToggle = document.getElementById("record-toggle");
    const viewerClose = document.getElementById("viewer-close");
    const viewerLayout = document.getElementById("viewer-layout");

    function syncRecordPanelWidth()
    {
        viewerLayout.style.setProperty("--record-panel-width", `${recordWrapper.getBoundingClientRect().width}px`);
    }

    function setRecordPanelOpen(isOpen)
    {
        syncRecordPanelWidth();
        viewerLayout.classList.toggle("record-open", isOpen);
        recordWrapper.classList.toggle("is-open", isOpen);
        recordToggle.setAttribute("aria-expanded", String(isOpen));
        recordToggle.textContent = isOpen ? "Hide record" : "Show record";
    }

    function closeViewer()
    {
        window.close();

        window.setTimeout(() => {
            if (!window.closed)
            {
                window.location.replace("about:blank");
            }
        }, 100);
    }

    viewerClose.addEventListener("click", closeViewer);

    if (objectData)
    {
        new Diva("diva-wrapper", {
            objectData,
        });
    }

    if (recordUrl)
    {
        recordFrame.src = recordUrl;
        recordToggle.hidden = false;
        recordToggle.addEventListener("click", () => setRecordPanelOpen(!recordWrapper.classList.contains("is-open")));
        window.addEventListener("resize", syncRecordPanelWidth);
        setRecordPanelOpen(true);
    }
    else
    {
        recordWrapper.hidden = true;
        recordToggle.hidden = true;
    }
</script>
</body>
</html>
