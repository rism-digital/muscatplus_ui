<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>RISM Online: Viewing IIIF Images</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/5.0.1/openseadragon.min.js"></script>
    <script type="application/javascript"
            src="/static/diva.js"></script>
    <style>
        body {
            padding: 0;
            margin: 0;
            font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
        }
        #diva-wrapper {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
<div id="diva-wrapper"></div>

<script>
    const searchParams = new URLSearchParams(window.location.search);

    const hash = window.location.hash || "";
    const hashQuery = hash.startsWith("#?") ? hash.slice(2)
            : hash.includes("?")
                ? hash.slice(hash.indexOf("?") + 1)
                : "";
    const hashParams = new URLSearchParams(hashQuery);

    const manifestParam = searchParams.get("manifest") || hashParams.get("manifest");
    const objectData = manifestParam && manifestParam.trim() ? manifestParam.trim() : null;

    if (objectData)
    {
        new Diva("diva-wrapper", {
            objectData,
        });
    }
</script>
</body>
</html>
