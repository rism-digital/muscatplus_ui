<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>RISM Online: Viewing IIIF Images</title>
    <script src="https://cdn.jsdelivr.net/npm/openseadragon@6.0.1/build/openseadragon/openseadragon.min.js"></script>
    <script type="application/javascript"
            src="/static/diva.js"></script>
    <style>
        body {
            padding: 0;
            margin: 0;
            font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
        }
        #viewer-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        #diva-wrapper {
            flex: 1 1 auto;
            min-width: 0;
        }
        #record-wrapper {
            width: 38vw;
            min-width: 320px;
            border-left: 1px solid #d9d9d9;
            display: none;
        }
        #record-frame {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
<div id="viewer-layout">
    <div id="diva-wrapper"></div>
    <div id="record-wrapper">
        <iframe id="record-frame" title="Record"></iframe>
    </div>
</div>

<script>
    const searchParams = new URLSearchParams(window.location.search);

    const hash = window.location.hash || "";
    const hashQuery = hash.startsWith("#?") ? hash.slice(2)
            : hash.includes("?")
                ? hash.slice(hash.indexOf("?") + 1)
                : "";
    const hashParams = new URLSearchParams(hashQuery);

    function getParamValue(name)
    {
        const value = searchParams.get(name) || hashParams.get(name);
        return value && value.trim() ? value.trim() : null;
    }

    const objectData = getParamValue("manifest");
    const recordUrl = getParamValue("record");

    if (objectData)
    {
        new Diva("diva-wrapper", {
            objectData,
        });
    }

    if (recordUrl)
    {
        const recordWrapper = document.getElementById("record-wrapper");
        const recordFrame = document.getElementById("record-frame");

        recordFrame.src = recordUrl;
        recordWrapper.style.display = "block";
    }
</script>
</body>
</html>
